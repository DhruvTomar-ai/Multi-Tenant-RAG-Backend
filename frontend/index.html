<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Tenant RAG Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">R</div>
          <div>
            <h1>RAG Hub</h1>
            <small>Multi-tenant workspace</small>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-link active" data-target="tenants-section">Tenants</button>
          <button class="nav-link" data-target="documents-section">Documents</button>
          <button class="nav-link" data-target="search-section">Search</button>
          <button class="nav-link" data-target="chat-section">Chat</button>
        </nav>

        <div class="api-config card compact">
          <label for="apiBaseUrl">API Base URL</label>
          <input id="apiBaseUrl" type="text" value="http://localhost:8000" />
          <button id="saveApiBaseUrl" class="secondary small">Save</button>
        </div>
      </aside>

      <main class="content">
        <header class="page-header">
          <div>
            <p class="eyebrow">Workflow 6</p>
            <h2>Multi-Tenant RAG Dashboard</h2>
          </div>
          <div id="appStatus" class="status-badge neutral">Ready</div>
        </header>

        <section id="tenants-section" class="panel active-panel">
          <div class="card">
            <h3>Create tenant</h3>
            <form id="tenantForm" class="stacked-form">
              <div class="two-col">
                <label>
                  <span>Slug</span>
                  <input name="slug" placeholder="tenant-alpha" required />
                </label>
                <label>
                  <span>Name</span>
                  <input name="name" placeholder="Tenant Alpha" required />
                </label>
              </div>
              <div class="two-col">
                <label>
                  <span>Owner email</span>
                  <input name="owner_email" type="email" placeholder="owner@example.com" required />
                </label>
                <label>
                  <span>Owner full name</span>
                  <input name="owner_full_name" placeholder="Owner Name" required />
                </label>
              </div>
              <label>
                <span>Owner password</span>
                <input name="owner_password" type="password" placeholder="StrongPass123" required />
              </label>
              <button type="submit">Create tenant</button>
            </form>
          </div>

          <div class="card">
            <div class="section-header">
              <h3>Tenants</h3>
              <button id="refreshTenantsBtn" class="secondary small">Refresh</button>
            </div>
            <div id="tenantList" class="list-grid"></div>
          </div>
        </section>

        <section id="documents-section" class="panel">
          <div class="card">
            <h3>Upload document</h3>
            <form id="documentForm" class="stacked-form">
              <label>
                <span>Tenant</span>
                <select id="documentTenantSelect" required></select>
              </label>
              <label>
                <span>File</span>
                <input id="documentFileInput" type="file" name="file" required />
              </label>
              <label>
                <span>Metadata JSON</span>
                <textarea id="documentMetadata" rows="4" placeholder='{"source":"ui","department":"operations"}'></textarea>
              </label>
              <button type="submit">Upload document</button>
            </form>
          </div>

          <div class="card">
            <div class="section-header">
              <h3>Documents</h3>
              <button id="refreshDocumentsBtn" class="secondary small">Refresh</button>
            </div>
            <div id="documentList" class="list-grid"></div>
          </div>
        </section>

        <section id="search-section" class="panel">
          <div class="card">
            <h3>Semantic search</h3>
            <form id="searchForm" class="stacked-form">
              <label>
                <span>Tenant</span>
                <select id="searchTenantSelect" required></select>
              </label>
              <label>
                <span>Query</span>
                <textarea id="searchQuery" rows="3" placeholder="Ask a question about the uploaded documents..." required></textarea>
              </label>
              <div class="two-col">
                <label>
                  <span>k</span>
                  <input id="searchK" type="number" min="1" max="20" value="5" />
                </label>
                <label>
                  <span>Similarity threshold</span>
                  <input id="searchThreshold" type="number" step="0.01" min="0" max="1" value="0.0" />
                </label>
              </div>
              <button type="submit">Search</button>
            </form>
          </div>

          <div class="card">
            <h3>Search results</h3>
            <div id="searchResults" class="result-list"></div>
          </div>
        </section>

        <section id="chat-section" class="panel">
          <div class="card">
            <h3>Conversations</h3>
            <form id="conversationForm" class="stacked-form">
              <label>
                <span>Tenant</span>
                <select id="conversationTenantSelect" required></select>
              </label>
              <label>
                <span>Title</span>
                <input id="conversationTitle" type="text" placeholder="New security question" />
              </label>
              <button type="submit">Create conversation</button>
            </form>
          </div>

          <div class="card">
            <div class="section-header">
              <h3>Conversation history</h3>
              <button id="refreshConversationsBtn" class="secondary small">Refresh</button>
            </div>
            <div id="conversationList" class="conversation-list"></div>
          </div>

          <div class="card">
            <h3>Active chat</h3>
            <div id="chatThread" class="chat-thread"></div>
            <form id="messageForm" class="stacked-form">
              <label>
                <span>Message</span>
                <textarea id="messageInput" rows="3" placeholder="Ask a question related to the tenant documents..." required></textarea>
              </label>
              <button type="submit">Send</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
