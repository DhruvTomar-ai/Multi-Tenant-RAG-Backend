[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-rag"
version = "0.1.0"
description = "Multi-tenant RAG backend with strict tenant, team and role isolation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "passlib>=1.7.4",
    # passlib 1.7.4 is incompatible with bcrypt 5.
    "bcrypt>=4.1,<5",
    "celery[redis]>=5.4,<6",
    # Only the core and file readers: the "llama-index" meta-package pulls in OpenAI integrations.
    "llama-index-core>=0.12,<1",
    "llama-index-readers-file>=0.4,<1",
    "pypdf>=5.0",
    "docx2txt>=0.8",
    "sentence-transformers>=3,<6",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
